<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Happy National Girlfriend Day</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page">
        <h1>Happy National Girlfriend Day</h1>
        <p class="sub">Thank you for being my favorite person.</p>

        <div class="stickers" aria-hidden="true">
            <span>🌷</span><span>🧸</span><span>🤍</span>
        </div>

        <p id="message" class="message" aria-live="polite">Klik tombol di bawah, ada pesan kecil buat kamu.</p>
        <button id="open" type="button">Buka pesan</button>
    </main>

    <script src="script.js"></script>
</body>

</html>
